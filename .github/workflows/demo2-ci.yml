name: demo2-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pytest pyyaml yamllint

      - name: Lint YAML
        run: |
          python -m yamllint .

      - name: Run tests
        run: |
          python -m pytest -q
